[project]
name = "hell-gate-bridge"
version = "0.1.0"
requires-python = ">=3.13"
description = "Sidecar worker that polls the Amtrak live tracker and publishes MQTT position messages"
dependencies = [
    "httpx>=0.28",
    "aiomqtt>=2.3",
    "cryptography>=44",
]

[dependency-groups]
dev = [
    "commitizen",
    "pre-commit",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hell_gate_bridge"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "TCH", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/hell_gate_bridge/__init__.py" = ["F401"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_provider = "uv"
update_changelog_on_bump = true
major_version_zero = true
