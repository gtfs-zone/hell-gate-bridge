
name: Build

# Requires:
#   Variables (Settings → Variables → Actions):
#     REGISTRY_DOMAIN  - hostname of the container registry, e.g. git.kcfam.us
#     DEPLOY_USER      - username to authenticate with the registry, e.g. maxtkc
#   Secrets (Settings → Secrets → Actions):
#     DEPLOY_TOKEN     - access token with write:package and write:repository scope

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build:
    runs-on: alpine-3.23

    steps:
      - name: Install dependencies
        run: apk add --no-cache docker-cli docker-cli-buildx git nodejs

      - name: Checkout
        uses: actions/checkout@v6
        with:

          github-server-url: https://${{ vars.REGISTRY_DOMAIN }}

      - name: Login to registry
        run: |
          echo "${{ secrets.DEPLOY_TOKEN }}" | \
            docker login ${{ vars.REGISTRY_DOMAIN }} -u ${{ vars.DEPLOY_USER }} --password-stdin

      - name: Build and push
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          SHA=$(git rev-parse --short HEAD)
          IMAGE=${{ vars.REGISTRY_DOMAIN }}/${{ github.repository }}
          TAGS="-t $IMAGE:$SHA -t $IMAGE:latest"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAGS="$TAGS -t $IMAGE:${{ github.ref_name }}"
          fi
          docker build $TAGS .
          docker push --all-tags $IMAGE


